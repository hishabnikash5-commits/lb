<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Leaderboard</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0a0e13; --card:#10161d; --line:#1b242e; --text:#e8eef5; --mute:#7c8a99;
  --acc:#2dd4a0; --acc-bg:rgba(45,212,160,.12); --gold:#e8b931; --silver:#b8c2cc; --bronze:#c98a5a;
  --warn:#f0a43a; --ok:#2dd4a0; --row:#0d131a;
}
:root[data-theme="light"]{
  --bg:#f1f4f8; --card:#ffffff; --line:#e3e8ee; --text:#14202b; --mute:#6b7886;
  --acc:#12a37a; --acc-bg:rgba(18,163,122,.10); --gold:#c99a10; --silver:#8b97a3; --bronze:#b3723f;
  --warn:#d9822b; --ok:#12a37a; --row:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100%}
body{max-width:560px;margin:0 auto;padding:0 12px calc(86px + env(safe-area-inset-bottom))}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{display:flex;align-items:center;gap:10px;padding:14px 4px 10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc-bg);border:1px solid var(--acc);display:grid;place-items:center;font-size:18px;flex:none}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:13px;letter-spacing:.08em;font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl p{font-size:11px;color:var(--mute);margin-top:2px}
.ttl p b{color:var(--acc);font-weight:700}
#themeBtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--acc);background:var(--acc-bg);color:var(--acc);font-size:16px;cursor:pointer;flex:none}
.prizes{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.prizes::-webkit-scrollbar{display:none}
.tile{flex:1 0 0;min-width:78px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 8px}
.tile .rk{font-size:8.5px;letter-spacing:.1em;color:var(--mute);font-weight:700;text-transform:uppercase}
.tile .am{font-size:19px;font-weight:800;margin:4px 0 2px}
.tile .mn{font-size:10px;color:var(--mute)}
.tile.t1{background:linear-gradient(160deg,rgba(232,185,49,.22),var(--card) 70%);border-color:rgba(232,185,49,.45)}
.tile.t1 .am{color:var(--gold)}
.tile.t2{background:linear-gradient(160deg,rgba(184,194,204,.18),var(--card) 70%);border-color:rgba(184,194,204,.4)}
.tile.t2 .am{color:var(--silver)}
.tile.t3{background:linear-gradient(160deg,rgba(201,138,90,.2),var(--card) 70%);border-color:rgba(201,138,90,.42)}
.tile.t3 .am{color:var(--bronze)}
.list{display:flex;flex-direction:column;gap:7px}
.row{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:11px;background:var(--row);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.row.me{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.medal{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;border:1px solid var(--line);color:var(--mute)}
.medal.m1{background:var(--gold);color:#1a1400;border-color:var(--gold)}
.medal.m2{background:var(--silver);color:#10161d;border-color:var(--silver)}
.medal.m3{background:var(--bronze);color:#1c0f05;border-color:var(--bronze)}
.who{min-width:0}
.who .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .sb{font-size:10.5px;color:var(--mute);margin-top:2px}
.cnt{text-align:right}
.cnt .n{font-size:17px;font-weight:800}
.cnt .n small{font-size:9px;color:var(--mute);font-weight:700;margin-left:3px}
.pill{display:inline-block;margin-top:3px;font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--warn);border:1px solid var(--warn);border-radius:99px;padding:1px 7px;text-transform:uppercase}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.msg{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:26px 14px;text-align:center;color:var(--mute);font-size:13px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.me-card{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--acc);border-radius:12px;padding:10px 12px}
.you{background:var(--acc);color:#04130d;font-size:9px;font-weight:900;letter-spacing:.08em;border-radius:6px;padding:3px 6px;flex:none}
.me-card .tx{flex:1;font-size:12px;color:var(--mute);min-width:0}
.me-card .tx b{color:var(--text)}
.me-card .c{font-size:16px;font-weight:800}
.skel{height:52px;border-radius:12px;background:var(--card);border:1px solid var(--line);opacity:.6;animation:p 1.2s infinite ease-in-out}
@keyframes p{50%{opacity:.25}}
</style>
</head>
<body>
<header>
  <div class="logo">🏆</div>
  <div class="ttl"><h1 id="title">TODAY LEADERBOARD</h1><p id="sub">loading…</p></div>
  <button id="themeBtn" aria-label="Theme">🌙</button>
</header>
<div id="prizes" class="prizes"></div>
<div id="list" class="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
<div class="bar"><div class="me-card"><span class="you">YOU</span><div class="tx" id="meTx">…</div><div class="c mono" id="meC">0</div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD-a9prfnn6h-w-Cpg5V4bMgSx1T0pqZoM",
  authDomain: "raisul-number.firebaseapp.com",
  projectId: "raisul-number",
  storageBucket: "raisul-number.firebasestorage.app",
  messagingSenderId: "279516228937",
  appId: "1:279516228937:web:fb729ee6e4c418cffbbe98",
  measurementId: "G-YZKJM1T6L1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
const myId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? String(tg.initDataUnsafe.user.id) : "";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let board = null;
let myHash = "";
let closesAt = 0;
let lastDay = "";

function getSavedTheme() { try { return localStorage.getItem("lb_theme"); } catch (e) { return null; } }
function setSavedTheme(t) { try { localStorage.setItem("lb_theme", t); } catch (e) {} }
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  $("themeBtn").textContent = t === "dark" ? "🌙" : "☀️";
}
let theme = getSavedTheme() || "dark";
applyTheme(theme);
$("themeBtn").onclick = () => { theme = theme === "dark" ? "light" : "dark"; setSavedTheme(theme); applyTheme(theme); };

async function sha16(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("").slice(0, 16);
}

function tierFor(tiers, rank) {
  for (const t of tiers || []) { if (rank >= t.from && rank <= t.to) return t; }
  return null;
}
function fmt(n) { return Number(n).toFixed(2); }

function renderPrizes(b) {
  const el = $("prizes");
  el.innerHTML = "";
  (b.tiers || []).forEach((t, i) => {
    const d = document.createElement("div");
    d.className = "tile" + (i < 3 ? " t" + (i + 1) : "");
    const label = t.from === t.to ? "RANK " + t.from : "RANK " + t.from + "-" + t.to;
    d.innerHTML = '<div class="rk">' + esc(label) + '</div><div class="am mono">' + esc(fmt(t.reward)) + '</div><div class="mn">' + esc(t.min) + "+ OTP</div>";
    el.appendChild(d);
  });
}

function renderList(b) {
  const el = $("list");
  el.innerHTML = "";
  if (!b.enabled) {
    el.innerHTML = '<div class="msg">🔒 Leaderboard is currently closed.<br>Please check back later.</div>';
    return;
  }
  const top = b.top || [];
  if (!top.length) {
    el.innerHTML = '<div class="msg">No OTP yet today.<br>Be the first to reach the board!</div>';
    return;
  }
  const myRank = myHash && b.order ? b.order.indexOf(myHash) + 1 : 0;
  top.forEach((r) => {
    const t = tierFor(b.tiers, r.r);
    const need = t ? Math.max(0, t.min - r.c) : 0;
    const d = document.createElement("div");
    d.className = "row" + (myRank === r.r ? " me" : "");
    const mc = r.r <= 3 ? " m" + r.r : "";
    const pill = t ? (need > 0 ? '<span class="pill">' + need + " MORE</span>" : '<span class="pill ok">QUALIFIED</span>') : "";
    d.innerHTML =
      '<div class="medal' + mc + '">' + r.r + "</div>" +
      '<div class="who"><div class="nm mono">' + esc(r.n) + '</div><div class="sb mono">' + esc(r.s) + "</div></div>" +
      '<div class="cnt"><div class="n mono">' + r.c + "<small>OTP</small></div>" + pill + "</div>";
    el.appendChild(d);
  });
}

function renderMe(b) {
  const tx = $("meTx");
  const cEl = $("meC");
  if (!myId) { tx.textContent = "Open from Telegram to see your rank"; cEl.textContent = "-"; return; }
  const c = (b.h && myHash && b.h[myHash]) ? b.h[myHash] : 0;
  cEl.textContent = c;
  if (!b.enabled) { tx.textContent = "Leaderboard is closed"; return; }
  if (c <= 0) { tx.textContent = "No OTP yet today — the board is waiting"; return; }
  const rank = b.order ? b.order.indexOf(myHash) + 1 : 0;
  if (rank > 0 && rank <= b.top_n) {
    const t = tierFor(b.tiers, rank);
    const need = t ? Math.max(0, t.min - c) : 0;
    tx.innerHTML = "Rank <b>#" + rank + "</b> · " + (need > 0 ? "<b>" + need + "</b> more OTP to win " + fmt(t.reward) : "You are qualified for " + fmt(t.reward));
  } else if (rank > 0) {
    tx.innerHTML = "Rank <b>#" + rank + "</b> · reach the top " + b.top_n + " to win";
  } else {
    tx.innerHTML = "Keep going — reach the top " + b.top_n + " to win";
  }
}

function tick() {
  if (!closesAt) return;
  const left = Math.max(0, closesAt - Date.now());
  const h = Math.floor(left / 3600000);
  const m = Math.floor((left % 3600000) / 60000);
  const s = Math.floor((left % 60000) / 1000);
  const el = $("cd");
  if (el) el.textContent = String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0") + (h === 0 && m < 5 ? ":" + String(s).padStart(2, "0") : "");
}
setInterval(tick, 1000);

function renderAll(b) {
  board = b;
  if (!getSavedTheme() && (b.theme === "light" || b.theme === "dark")) { theme = b.theme; applyTheme(theme); }
  $("title").textContent = b.title || "TODAY LEADERBOARD";
  const d = b.bday ? new Date(b.bday + "T00:00:00") : null;
  const dateTxt = d ? d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" }) : "";
  closesAt = b.closes_at ? Date.parse(b.closes_at) : 0;
  $("sub").innerHTML = esc(dateTxt) + " · closes in <b id=\"cd\" class=\"mono\">--:--</b>";
  tick();
  renderPrizes(b);
  renderList(b);
  renderMe(b);
  lastDay = b.bday || "";
}

async function load() {
  try {
    const snap = await getDoc(doc(db, "lb_public", "board"));
    if (!snap.exists()) {
      $("list").innerHTML = '<div class="msg">Leaderboard is not ready yet.<br>Please try again in a moment.</div>';
      $("sub").textContent = "waiting for data";
      return;
    }
    const b = snap.data();
    if (b.salt && myId && !myHash) { myHash = await sha16(b.salt + ":" + myId); }
    renderAll(b);
  } catch (e) {
    $("list").innerHTML = '<div class="msg">Could not load the leaderboard.<br>Check your connection and reopen.</div>';
    $("sub").textContent = "offline";
  }
}

load();
setInterval(() => { if (!document.hidden) load(); }, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>

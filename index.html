<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Leaderboard</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0a0e13; --card:#10161d; --line:#1b242e; --text:#e8eef5; --mute:#7c8a99;
  --acc:#2dd4a0; --acc-bg:rgba(45,212,160,.12); --gold:#e8b931; --silver:#b8c2cc; --bronze:#c98a5a;
  --warn:#f0a43a; --ok:#2dd4a0; --row:#0d131a; --shadow:rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  --bg:#f1f4f8; --card:#ffffff; --line:#e3e8ee; --text:#14202b; --mute:#6b7886;
  --acc:#12a37a; --acc-bg:rgba(18,163,122,.10); --gold:#c99a10; --silver:#8b97a3; --bronze:#b3723f;
  --warn:#d9822b; --ok:#12a37a; --row:#ffffff; --shadow:rgba(20,32,43,.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100%}
body{max-width:560px;margin:0 auto;padding:0 12px calc(112px + env(safe-area-inset-bottom))}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{font-family:inherit}

header{display:flex;align-items:center;gap:11px;padding:14px 2px 10px}
.av-wrap{position:relative;flex:none}
.av{border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:800;flex:none;background:var(--line);user-select:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.chip{position:absolute;right:-6px;bottom:-4px;background:var(--acc);color:#04130d;font-size:10px;font-weight:900;border-radius:99px;padding:2px 6px;border:2px solid var(--bg)}
.ttl{flex:1;min-width:0}
.ttl .hi{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl h1{font-size:13px;letter-spacing:.08em;font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ttl p{font-size:11px;color:var(--mute);margin-top:2px}
.ttl p b{color:var(--acc);font-weight:700}
.ttl p.urgent b{color:#ff5d5d}
.ibtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--acc);background:var(--acc-bg);color:var(--acc);font-size:15px;font-weight:800;cursor:pointer;flex:none}

.pool{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:8px;font-size:11.5px;color:var(--mute)}
.pool b{color:var(--text);font-size:14px}
.pool .q{color:var(--acc);font-weight:700}
.prizes{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.prizes::-webkit-scrollbar{display:none}
.tile{flex:1 0 0;min-width:78px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 8px}
.tile .rk{font-size:8.5px;letter-spacing:.1em;color:var(--mute);font-weight:700;text-transform:uppercase}
.tile .am{font-size:19px;font-weight:800;margin:4px 0 2px}
.tile .mn{font-size:10px;color:var(--mute)}
.tile.t1{background:linear-gradient(160deg,rgba(232,185,49,.22),var(--card) 70%);border-color:rgba(232,185,49,.45)}
.tile.t1 .am{color:var(--gold)}
.tile.t2{background:linear-gradient(160deg,rgba(184,194,204,.18),var(--card) 70%);border-color:rgba(184,194,204,.4)}
.tile.t2 .am{color:var(--silver)}
.tile.t3{background:linear-gradient(160deg,rgba(201,138,90,.2),var(--card) 70%);border-color:rgba(201,138,90,.42)}
.tile.t3 .am{color:var(--bronze)}

.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:10px}
.tabs.hidden{display:none}
.tabs button{flex:1;border:0;border-radius:9px;padding:8px 6px;font-size:12px;font-weight:800;letter-spacing:.04em;background:transparent;color:var(--mute);cursor:pointer}
.tabs button.on{background:var(--acc-bg);color:var(--acc)}

.podium{display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:8px;align-items:end;margin-bottom:10px}
.podium:empty{display:none}
.pod{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px 10px;text-align:center;min-width:0}
.pod.p1{background:linear-gradient(180deg,rgba(232,185,49,.20),var(--card) 75%);border-color:rgba(232,185,49,.5);padding-top:16px;padding-bottom:14px}
.pod.p2{background:linear-gradient(180deg,rgba(184,194,204,.16),var(--card) 75%);border-color:rgba(184,194,204,.42)}
.pod.p3{background:linear-gradient(180deg,rgba(201,138,90,.18),var(--card) 75%);border-color:rgba(201,138,90,.45)}
.pod.me{box-shadow:0 0 0 2px var(--acc)}
.pod .avw{position:relative;width:max-content;margin:0 auto 6px}
.pod .rb{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;color:#14100a;border:2px solid var(--card)}
.p1 .rb{background:var(--gold)} .p2 .rb{background:var(--silver)} .p3 .rb{background:var(--bronze)}
.p1 .av{box-shadow:0 0 0 2px var(--gold)} .p2 .av{box-shadow:0 0 0 2px var(--silver)} .p3 .av{box-shadow:0 0 0 2px var(--bronze)}
.pod .nm{font-size:11px;font-weight:700;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .ct{font-size:18px;font-weight:800;margin-top:3px}
.pod .ct small{font-size:9px;color:var(--mute);margin-left:2px}
.pod .pz{display:inline-block;margin-top:5px;font-size:10px;font-weight:800;border-radius:99px;padding:2px 8px;background:var(--acc-bg);color:var(--acc)}
.pod .pz.no{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.pod.empty{visibility:hidden}

.list{display:flex;flex-direction:column;gap:7px}
.row{display:grid;grid-template-columns:26px 38px 1fr auto;align-items:center;gap:10px;background:var(--row);border:1px solid var(--line);border-radius:12px;padding:9px 12px 9px 10px}
.row.me{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.rn{font-size:12px;font-weight:800;color:var(--mute);text-align:center}
.who{min-width:0}
.who .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .sb{font-size:10.5px;color:var(--mute);margin-top:2px}
.cnt{text-align:right}
.cnt .n{font-size:17px;font-weight:800}
.cnt .n small{font-size:9px;color:var(--mute);font-weight:700;margin-left:3px}
.pill{display:inline-block;margin-top:3px;font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--warn);border:1px solid var(--warn);border-radius:99px;padding:1px 7px;text-transform:uppercase}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.msg{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:26px 14px;text-align:center;color:var(--mute);font-size:13px;line-height:1.5}
.skel{height:52px;border-radius:12px;background:var(--card);border:1px solid var(--line);opacity:.6;animation:p 1.2s infinite ease-in-out}
@keyframes p{50%{opacity:.25}}

.bar{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,transparent)}
.me-card{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:10px 12px;box-shadow:0 6px 18px var(--shadow)}
.you{position:absolute;left:50%;top:-8px;transform:translateX(-50%);background:var(--acc);color:#04130d;font-size:8px;font-weight:900;letter-spacing:.08em;border-radius:6px;padding:2px 5px;white-space:nowrap}
.me-card .mid{flex:1;min-width:0}
.me-card .tx{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-card .tx b{color:var(--text)}
.prog{height:7px;border-radius:99px;background:var(--line);margin-top:7px;overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--acc),#7cf0c9);transition:width .8s ease}
.prog.full i{background:linear-gradient(90deg,var(--gold),#ffe27a)}
.pl{font-size:10px;color:var(--mute);margin-top:4px}
.me-card .c{font-size:20px;font-weight:800;min-width:30px;text-align:right}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet.hidden{display:none}
.sheet .box{width:100%;max-width:560px;background:var(--card);border-top-left-radius:18px;border-top-right-radius:18px;border:1px solid var(--line);padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.sheet .rules{font-size:13px;line-height:1.6;color:var(--text);white-space:pre-wrap}
.sheet button{margin-top:14px;width:100%;border:0;border-radius:10px;padding:11px;font-weight:800;background:var(--acc);color:#04130d;cursor:pointer}
#cf{position:fixed;inset:0;pointer-events:none;z-index:60}
</style>
</head>
<body>
<header>
  <div class="av-wrap"><div id="meAv"></div><span id="meChip" class="chip" style="display:none"></span></div>
  <div class="ttl"><div class="hi" id="hi"></div><h1 id="title">TODAY LEADERBOARD</h1><p id="sub">loading…</p></div>
  <button id="rulesBtn" class="ibtn" aria-label="Rules">?</button>
  <button id="themeBtn" class="ibtn" aria-label="Theme">🌙</button>
</header>
<div id="pool" class="pool" style="display:none"></div>
<div id="prizes" class="prizes"></div>
<div id="tabs" class="tabs hidden"><button id="tabToday" class="on">TODAY</button><button id="tabYday">YESTERDAY</button></div>
<div id="podium" class="podium"></div>
<div id="list" class="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>

<div class="bar"><div class="me-card" style="position:relative">
  <span class="you">YOU</span>
  <div id="meAv2"></div>
  <div class="mid"><div class="tx" id="meTx">…</div><div class="prog" id="prog"><i id="progI"></i></div><div class="pl mono" id="progL"></div></div>
  <div class="c mono" id="meC">0</div>
</div></div>

<div id="sheet" class="sheet hidden"><div class="box"><h3>How it works</h3><div id="rulesTx" class="rules"></div><button id="sheetClose">GOT IT</button></div></div>
<canvas id="cf"></canvas>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD-a9prfnn6h-w-Cpg5V4bMgSx1T0pqZoM",
  authDomain: "raisul-number.firebaseapp.com",
  projectId: "raisul-number",
  storageBucket: "raisul-number.firebasestorage.app",
  messagingSenderId: "279516228937",
  appId: "1:279516228937:web:fb729ee6e4c418cffbbe98",
  measurementId: "G-YZKJM1T6L1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
const myId = tgUser ? String(tgUser.id) : "";
const myName = tgUser ? (tgUser.first_name || tgUser.username || "") : "";
const tgPhoto = tgUser && tgUser.photo_url ? tgUser.photo_url : "";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function haptic(kind) { try { if (tg && tg.HapticFeedback) { if (kind === "success") tg.HapticFeedback.notificationOccurred("success"); else tg.HapticFeedback.impactOccurred("light"); } } catch (e) {} }

let board = null;
let myHash = "";
let closesAt = 0;
let tab = "today";
let avatars = {};
let avV = "";
let ownPhoto = "";
let ownTries = 0;

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  $("themeBtn").textContent = t === "dark" ? "🌙" : "☀️";
}
let theme = lsGet("lb_theme") || "dark";
applyTheme(theme);
$("themeBtn").onclick = () => { theme = theme === "dark" ? "light" : "dark"; lsSet("lb_theme", theme); applyTheme(theme); haptic(); };

const PALETTE = ["#3b82f6", "#a855f7", "#ec4899", "#f97316", "#14b8a6", "#eab308", "#ef4444", "#22c55e"];
function colorFor(k) { let h = 0; const s = String(k || "x"); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return PALETTE[h % PALETTE.length]; }

function makeAvatar(k, initial, size, src) {
  const d = document.createElement("div");
  d.className = "av";
  d.style.width = size + "px";
  d.style.height = size + "px";
  d.style.fontSize = Math.round(size * 0.42) + "px";
  const fallback = () => { d.innerHTML = ""; d.textContent = initial || "?"; d.style.background = colorFor(k); d.style.color = "#fff"; };
  if (src) {
    const img = new Image();
    img.alt = "";
    img.onerror = fallback;
    img.src = src;
    d.appendChild(img);
  } else { fallback(); }
  return d;
}
function photoFor(k) {
  if (!board || !board.show_photos) return "";
  if (avatars[k]) return avatars[k];
  if (k && k === myHash && (tgPhoto || ownPhoto)) return tgPhoto || ownPhoto;
  return "";
}

async function sha16(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("").slice(0, 16);
}
function tierFor(tiers, rank) { for (const t of tiers || []) { if (rank >= t.from && rank <= t.to) return t; } return null; }
const fmt = (n) => Number(n).toFixed(2);

function renderPrizes(b) {
  const el = $("prizes");
  el.innerHTML = "";
  (b.tiers || []).forEach((t, i) => {
    const d = document.createElement("div");
    d.className = "tile" + (i < 3 ? " t" + (i + 1) : "");
    const label = t.from === t.to ? "RANK " + t.from : "RANK " + t.from + "-" + t.to;
    d.innerHTML = '<div class="rk">' + esc(label) + '</div><div class="am mono">' + esc(fmt(t.reward)) + '</div><div class="mn">' + esc(t.min) + "+ OTP</div>";
    el.appendChild(d);
  });
}

function renderPool(b) {
  const el = $("pool");
  if (tab !== "today" || !b.enabled) { el.style.display = "none"; return; }
  let max = 0;
  for (let r = 1; r <= b.top_n; r++) { const t = tierFor(b.tiers, r); if (t) max += Number(t.reward); }
  let earned = 0, q = 0;
  (b.top || []).forEach((x) => { const t = tierFor(b.tiers, x.r); if (t && x.c >= t.min) { earned += Number(t.reward); q++; } });
  el.style.display = "flex";
  el.innerHTML = '<span>💰 PRIZE POOL TODAY</span><span><b class="mono">' + fmt(earned) + '</b> / ' + fmt(max) + ' · <span class="q">' + q + " qualified</span></span>";
}

function entriesForTab(b) {
  if (tab === "yday") return (b.yday && b.yday.entries) ? b.yday.entries : [];
  return b.top || [];
}

function podiumCard(e, cls, b) {
  const d = document.createElement("div");
  d.className = "pod " + cls + (e.k === myHash && myHash ? " me" : "");
  const size = cls === "p1" ? 62 : 52;
  const avw = document.createElement("div");
  avw.className = "avw";
  avw.appendChild(makeAvatar(e.k, e.i, size, photoFor(e.k)));
  const rb = document.createElement("div");
  rb.className = "rb";
  rb.textContent = e.r;
  avw.appendChild(rb);
  d.appendChild(avw);
  let pz = "";
  if (tab === "yday") {
    pz = e.rw > 0 ? '<span class="pz">+' + esc(fmt(e.rw)) + "</span>" : '<span class="pz no">no prize</span>';
  } else {
    const t = tierFor(b.tiers, e.r);
    if (t) pz = e.c >= t.min ? '<span class="pz">+' + esc(fmt(t.reward)) + "</span>" : '<span class="pz no">' + Math.max(0, t.min - e.c) + " more</span>";
  }
  const info = document.createElement("div");
  info.innerHTML = '<div class="nm mono">' + esc(e.n) + '</div><div class="ct mono">' + esc(e.c) + "<small>OTP</small></div>" + pz;
  d.appendChild(info);
  return d;
}

function rowCard(e, b) {
  const d = document.createElement("div");
  d.className = "row" + (e.k === myHash && myHash ? " me" : "");
  const rn = document.createElement("div");
  rn.className = "rn";
  rn.textContent = e.r;
  d.appendChild(rn);
  d.appendChild(makeAvatar(e.k, e.i, 38, photoFor(e.k)));
  const w = document.createElement("div");
  w.className = "who";
  w.innerHTML = '<div class="nm mono">' + esc(e.n) + '</div><div class="sb mono">' + esc(e.s) + "</div>";
  d.appendChild(w);
  let pill = "";
  if (tab === "yday") {
    pill = e.rw > 0 ? '<span class="pill ok">+' + esc(fmt(e.rw)) + "</span>" : "";
  } else {
    const t = tierFor(b.tiers, e.r);
    if (t) {
      const need = Math.max(0, t.min - e.c);
      pill = need > 0 ? '<span class="pill">' + need + " MORE</span>" : '<span class="pill ok">QUALIFIED</span>';
    }
  }
  const c = document.createElement("div");
  c.className = "cnt";
  c.innerHTML = '<div class="n mono">' + esc(e.c) + "<small>OTP</small></div>" + pill;
  d.appendChild(c);
  return d;
}

function renderList(b) {
  const pod = $("podium");
  const list = $("list");
  pod.innerHTML = "";
  list.innerHTML = "";
  if (!b.enabled) {
    list.innerHTML = '<div class="msg">🔒 Leaderboard is currently closed.<br>Please check back later.</div>';
    return;
  }
  const ent = entriesForTab(b);
  if (!ent.length) {
    list.innerHTML = tab === "yday"
      ? '<div class="msg">No results from the last day yet.</div>'
      : '<div class="msg">No OTP yet today.<br>Be the first to reach the board!</div>';
    return;
  }
  const order = [ent[1], ent[0], ent[2]];
  const cls = ["p2", "p1", "p3"];
  order.forEach((e, i) => {
    if (e) { pod.appendChild(podiumCard(e, cls[i], b)); }
    else { const x = document.createElement("div"); x.className = "pod empty"; pod.appendChild(x); }
  });
  ent.slice(3).forEach((e) => list.appendChild(rowCard(e, b)));
}

function myState(b) {
  const c = (b.h && myHash && b.h[myHash]) ? b.h[myHash] : 0;
  const rank = (b.order && myHash) ? b.order.indexOf(myHash) + 1 : 0;
  let t = null;
  if (rank > 0 && rank <= b.top_n) t = tierFor(b.tiers, rank);
  const qualified = !!(t && c >= t.min);
  return { c, rank, t, qualified };
}

function renderMe(b) {
  const tx = $("meTx");
  const cEl = $("meC");
  const prog = $("prog");
  const pI = $("progI");
  const pL = $("progL");
  const name = myName || "You";
  const init = (name[0] || "?").toUpperCase();
  const photo = b.show_photos ? (tgPhoto || avatars[myHash] || ownPhoto) : "";
  $("meAv").replaceChildren(makeAvatar(myHash || "me", init, 46, photo));
  $("meAv2").replaceChildren(makeAvatar(myHash || "me", init, 38, photo));
  $("hi").textContent = myId ? "Hi, " + name + " 👋" : "Welcome";
  if (!myId) { tx.textContent = "Open from Telegram to see your rank"; cEl.textContent = "-"; prog.style.display = "none"; pL.textContent = ""; $("meChip").style.display = "none"; return; }
  const s = myState(b);
  cEl.textContent = s.c;
  const chip = $("meChip");
  if (b.enabled && s.rank > 0) { chip.textContent = "#" + s.rank; chip.style.display = ""; } else { chip.style.display = "none"; }
  if (!b.enabled) { tx.textContent = "Leaderboard is closed"; prog.style.display = "none"; pL.textContent = ""; return; }
  prog.style.display = "";
  let target = 0;
  if (s.t) { target = s.t.min; }
  else { (b.tiers || []).forEach((t) => { if (!target || t.min < target) target = t.min; }); }
  const pct = target ? Math.min(100, Math.round((s.c / target) * 100)) : 0;
  pI.style.width = pct + "%";
  prog.classList.toggle("full", s.qualified);
  pL.textContent = s.c >= target ? s.c + " OTP · target " + target + " reached ✓" : s.c + " / " + target + " OTP";
  if (s.c <= 0) { tx.textContent = "No OTP yet today — the board is waiting"; return; }
  if (s.rank > 0 && s.rank <= b.top_n) {
    const need = s.t ? Math.max(0, s.t.min - s.c) : 0;
    tx.innerHTML = "Rank <b>#" + s.rank + "</b> · " + (need > 0 ? "<b>" + need + "</b> more OTP to win " + fmt(s.t.reward) : "You will win <b>" + fmt(s.t.reward) + "</b>");
  } else if (s.rank > 0) {
    tx.innerHTML = "Rank <b>#" + s.rank + "</b> · reach the top " + b.top_n + " to win";
  } else {
    tx.innerHTML = "Keep going — reach the top " + b.top_n + " to win";
  }
}

function tick() {
  if (!closesAt) return;
  const left = Math.max(0, closesAt - Date.now());
  const h = Math.floor(left / 3600000);
  const m = Math.floor((left % 3600000) / 60000);
  const s = Math.floor((left % 60000) / 1000);
  const el = $("cd");
  if (el) {
    el.textContent = String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0") + (h === 0 ? ":" + String(s).padStart(2, "0") : "");
    const p = el.parentElement;
    if (p) p.classList.toggle("urgent", h === 0 && left > 0);
  }
}
setInterval(tick, 1000);

function renderHeaderSub(b) {
  closesAt = b.closes_at ? Date.parse(b.closes_at) : 0;
  $("sub").classList.remove("urgent");
  if (tab === "yday") {
    const yd = b.yday && b.yday.day ? b.yday.day : "";
    $("sub").innerHTML = "Results of <b>" + esc(yd) + "</b>";
    return;
  }
  const d = b.bday ? new Date(b.bday + "T00:00:00") : null;
  const dateTxt = d ? d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" }) : "";
  $("sub").innerHTML = esc(dateTxt) + ' · closes in <b id="cd" class="mono">--:--</b>';
  tick();
}

function renderAll(b) {
  board = b;
  if (!lsGet("lb_theme") && (b.theme === "light" || b.theme === "dark")) { theme = b.theme; applyTheme(theme); }
  $("title").textContent = tab === "yday" ? "YESTERDAY'S WINNERS" : (b.title || "TODAY LEADERBOARD");
  const hasY = !!(b.yday && b.yday.entries && b.yday.entries.length);
  $("tabs").classList.toggle("hidden", !hasY);
  if (!hasY && tab === "yday") tab = "today";
  $("tabToday").classList.toggle("on", tab === "today");
  $("tabYday").classList.toggle("on", tab === "yday");
  renderHeaderSub(b);
  renderPrizes(b);
  renderPool(b);
  renderList(b);
  renderMe(b);
  celebrate(b);
}

$("tabToday").onclick = () => { tab = "today"; haptic(); if (board) renderAll(board); };
$("tabYday").onclick = () => { tab = "yday"; haptic(); if (board) renderAll(board); };
$("rulesBtn").onclick = () => { $("rulesTx").textContent = (board && board.rules) ? board.rules : "Receive OTPs to climb the board. Prizes are paid automatically when the day ends."; $("sheet").classList.remove("hidden"); haptic(); };
$("sheetClose").onclick = () => $("sheet").classList.add("hidden");
$("sheet").onclick = (e) => { if (e.target === $("sheet")) $("sheet").classList.add("hidden"); };

let confettiBusy = false;
function confetti() {
  if (confettiBusy) return;
  confettiBusy = true;
  const cv = $("cf");
  const ctx = cv.getContext("2d");
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  const cols = ["#e8b931", "#2dd4a0", "#3b82f6", "#ec4899", "#f97316", "#a855f7"];
  const ps = [];
  for (let i = 0; i < 130; i++) {
    ps.push({ x: cv.width / 2, y: cv.height * 0.35, vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 13 - 3, g: 0.32, s: Math.random() * 6 + 3, c: cols[i % cols.length], r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4 });
  }
  const start = Date.now();
  (function frame() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach((p) => { p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6); ctx.restore(); });
    if (Date.now() - start < 2800) requestAnimationFrame(frame);
    else { ctx.clearRect(0, 0, cv.width, cv.height); confettiBusy = false; }
  })();
}
function celebrate(b) {
  if (!myId || !b.enabled || tab !== "today") return;
  const s = myState(b);
  if (!s.qualified) return;
  const key = "lb_cf_" + b.bday + "_" + s.rank;
  if (lsGet(key)) return;
  lsSet(key, "1");
  confetti();
  haptic("success");
}

async function loadExtras(b) {
  if (b.show_photos && b.av_v && b.av_v !== avV) {
    try {
      const s = await getDoc(doc(db, "lb_public", "avatars"));
      if (s.exists()) { avatars = s.data().m || {}; avV = b.av_v; }
    } catch (e) {}
  }
  if (b.show_photos && myHash && !tgPhoto && !avatars[myHash] && !ownPhoto && ownTries < 6) {
    ownTries++;
    try {
      const s = await getDoc(doc(db, "lb_public", "av_" + myHash));
      if (s.exists()) ownPhoto = s.data().u || "";
    } catch (e) {}
  }
}

async function load() {
  try {
    const snap = await getDoc(doc(db, "lb_public", "board"));
    if (!snap.exists()) {
      $("list").innerHTML = '<div class="msg">Leaderboard is not ready yet.<br>Please try again in a moment.</div>';
      $("sub").textContent = "waiting for data";
      return;
    }
    const b = snap.data();
    if (b.salt && myId && !myHash) { myHash = await sha16(b.salt + ":" + myId); }
    await loadExtras(b);
    renderAll(b);
  } catch (e) {
    $("list").innerHTML = '<div class="msg">Could not load the leaderboard.<br>Check your connection and reopen.</div>';
    $("sub").textContent = "offline";
  }
}

load();
setInterval(() => { if (!document.hidden) load(); }, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
